name: Build Jarvis ESP32

on:
  workflow_dispatch:
    inputs:
      source_b64:
        description: Base64-encoded sketch source for Jarvis/Jarvis.ino
        required: false
        type: string
      sketch_name:
        description: Sketch folder and .ino base name
        required: false
        default: Jarvis
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SKETCH_NAME: ${{ github.event.inputs.sketch_name || 'Jarvis' }}
      SKETCH_DIR: firmware/${{ github.event.inputs.sketch_name || 'Jarvis' }}
      BUILD_ID: ${{ github.run_number }}-${{ github.sha }}
      ARDUINO_LIBRARY_ENABLE_UNSAFE_INSTALL: true

    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          sudo mv bin/arduino-cli /usr/local/bin/
          arduino-cli config init
          arduino-cli config set library.enable_unsafe_install true

      - name: Setup ESP32 Core
        run: |
          arduino-cli core update-index \
            --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

          arduino-cli core install esp32:esp32@2.0.17 \
            --additional-urls https://raw.githubusercontent.com/espressif/arduino/esp32/gh-pages/package_esp32_index.json

      - name: Inject workflow source when provided
        shell: bash
        env:
          SOURCE_B64: ${{ github.event.inputs.source_b64 }}
        run: |
          if [ -n "$SOURCE_B64" ]; then
            mkdir -p "$SKETCH_DIR"
            printf "%s" "$SOURCE_B64" | base64 --decode > "$SKETCH_DIR/$SKETCH_NAME.ino"
          fi

      - name: Inject firmware build id
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          sketch_name = os.environ["SKETCH_NAME"]
          sketch_dir = os.environ["SKETCH_DIR"]
          build_id = os.environ["BUILD_ID"]
          path = Path(sketch_dir) / f"{sketch_name}.ino"
          text = path.read_text(encoding="utf-8")

          marker = '#ifndef FW_BUILD_ID'
          block = f'''#ifndef FW_BUILD_ID
          #define FW_BUILD_ID "{build_id}"
          #endif
          '''

          if marker in text:
              start = text.index('#ifndef FW_BUILD_ID')
              end = text.index('#endif', start) + len('#endif')
              text = text[:start] + block + text[end:]
          else:
              text = block + "\n" + text

          path.write_text(text, encoding="utf-8")
          PY

      - name: Parse and Install Missing Libraries
        shell: bash
        run: |
          arduino-cli lib update-index
          
          echo "===== DETECTING REQUIRED LIBRARIES ====="
          python - <<'PY'
          import re
          import os
          import subprocess
          from pathlib import Path

          sketch_name = os.environ["SKETCH_NAME"]
          sketch_dir = os.environ["SKETCH_DIR"]
          sketch_path = Path(sketch_dir) / f"{sketch_name}.ino"

          if not sketch_path.exists():
              print(f"Sketch file not found at {sketch_path}")
              exit(0)

          content = sketch_path.read_text(encoding="utf-8")
          includes = re.findall(r'#include\s*[<"]([\w\s\-_\.]+)\.h[>"]', content)
          
          ignored_libs = {
              "WiFi", "HTTPClient", "WiFiClient", "WiFiClientSecure", "SPI", "Wire", "FS", 
              "SPIFFS", "SD", "Preferences", "Ticker", "Update", "WebServer", 
              "DNSServer", "EEPROM", "BluetoothSerial", "BLEDevice", "BLEUtils",
              "BLEServer", "BLE2902"
          }

          git_mapping = {
              "BleKeyboard": "https://github.com/T-vK/ESP32-BLE-Keyboard.git",
              "NimBLEDevice": "https://github.com/h2zero/NimBLE-Arduino.git#1.4.1"
          }

          registry_mapping = {
              "ArduinoJson": "ArduinoJson",
              "Adafruit_GFX": "Adafruit GFX Library",
              "Adafruit_PCD8544": "Adafruit PCD8544 Nokia 5110 LCD library",
              "Encoder": "Encoder"
          }

          processed = set()
          
          if "BleKeyboard" in includes:
              if "NimBLEDevice" not in includes:
                  includes.append("NimBLEDevice")
              
              # Force-define NimBLE usage flags at the top of the file to trim down Bluetooth bloat.
              prefix = "#define USE_NIMBLE\n#define FORCE_NIMBLE\n#include <NimBLEDevice.h>\n"
              if "USE_NIMBLE" not in content:
                  print("Injecting explicit NimBLE definitions to strip firmware bloat...")
                  content = prefix + content
                  sketch_path.write_text(content, encoding="utf-8")

          for lib in includes:
              if lib in ignored_libs or lib in processed:
                  continue
              
              if lib in git_mapping:
                  git_url = git_mapping[lib]
                  print(f"Installing missing git dependency: {lib} via {git_url}")
                  subprocess.run(["arduino-cli", "lib", "install", "--git-url", git_url], check=False)
              else:
                  lib_name = registry_mapping.get(lib, lib)
                  print(f"Installing missing registry dependency: {lib_name}")
                  subprocess.run(["arduino-cli", "lib", "install", lib_name], check=False)
                  
              processed.add(lib)
          PY

      - name: Compile Code
        shell: bash
        run: |
          echo "===== COMPILING SKETCH WITH OPTIMIZATIONS ====="
          # Fixed: Reverted optimization back to -Os supported by core 2.0.17 toolchain
          arduino-cli compile \
            --fqbn esp32:esp32:esp32:PartitionScheme=min_spiffs \
            --build-property "compiler.cpp.extra_flags=-Os -ffunction-sections -fdata-sections -Wl,--gc-sections -DUSE_NIMBLE -DFORCE_NIMBLE -DCONFIG_NIMBLE_CPP_LOG_LEVEL=0" \
            "$SKETCH_DIR/$SKETCH_NAME.ino" \
            --export-binaries

          echo "===== INSTALLED LIBRARIES ====="
          arduino-cli lib list

      - name: Prepare firmware asset
        id: firmware
        shell: bash
        run: |
          mkdir -p release-assets firmware
          BIN_PATH=$(find "$SKETCH_DIR/build" -name "$SKETCH_NAME.ino.bin" | head -n 1)
          if [ -z "$BIN_PATH" ]; then
            echo "No sketch firmware.bin found" >&2
            exit 1
          fi
          cp "$BIN_PATH" release-assets/Jarvis.ino.bin
          echo "bin_path=release-assets/Jarvis.ino.bin" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "$BIN_PATH")" >> "$GITHUB_OUTPUT"

      - name: Write firmware manifest
        shell: bash
        run: |
          mkdir -p firmware site/firmware
          cat > firmware/manifest.json <<EOF
          {
            "build_id": "${BUILD_ID}",
            "bin_url": "https://github.com/Supercoderboi/JarvisOnline/releases/download/latest-firmware/Jarvis.ino.bin",
            "size": ${{ steps.firmware.outputs.size }}
          }
          EOF
          cp firmware/manifest.json site/firmware/manifest.json

      - name: Upload BIN file
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Firmware
          path: ${{ steps.firmware.outputs.bin_path }}

      - name: Publish latest firmware release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-firmware
          name: Latest Firmware
          body: Latest compiled Jarvis firmware from GitHub Actions.
          prerelease: true
          files: ${{ steps.firmware.outputs.bin_path }}
          overwrite_files: true

      - name: Commit updated manifest
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/manifest.json site/firmware/manifest.json
          git diff --cached --quiet || git commit -m "Update firmware manifest [skip ci]"
          git push
